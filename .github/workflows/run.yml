name: Stock Alert
on:
  schedule:
    - cron: '*/5 13-22 * * 1-5'
    # Runs every 5 minutes, between 13:00 and 22:59, Monday through Friday 
  workflow_dispatch:
jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - run: python alert.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
